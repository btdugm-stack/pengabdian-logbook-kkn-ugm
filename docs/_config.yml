# GitHub Pages Configuration
title: Pengabdian Logbook KKN
tagline: PoC Aplikasi Web untuk Manajemen Logbook KKN Mahasiswa UGM
description: Aplikasi berbasis PHP Native + MySQL dengan fitur dual-role authentication, logbook input, dan public search/mapping
url: "https://btdugm-stack.github.io"
baseurl: "/pengabdian-logbook-kkn-ugm"

# Theme (optional - kita pakai custom HTML/CSS)
# theme: jekyll-theme-cayman

# Language & Locale
lang: id_ID
locale: id_ID

# GitHub Metadata
repository: btdugm-stack/pengabdian-logbook-kkn-ugm
github_user: btdugm-stack

# Markdown
markdown: kramdown

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - index.php
  - db.php
  - config.php
  - database.sql
  - .qodo
  - exports/
  - .gitignore
  - DEPLOYMENT.md
  - GITHUB_SETUP.md
  - DEPLOYMENT_CHECKLIST.md
